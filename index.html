<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="author" content="Daniel Zhang">
        <meta name="description" content="generating image page">
        <meta name="keywords" content="html, css, web development, javascript">
        <link rel="icon" href="./assets/media/cobweb.png" type="image/x-icon"> 
        <link rel="stylesheet" href="./assets/style/index.css" media="all"> 
        <title>cookies</title>
        <script src="./assets/script/app.js" defer></script>
        <!-- Links to font awesome, Google fonts, etc. -->
    </head>
    <body>
      <div class="container">
        <main>
          <div>
            <p class="herotext">Welcome to My website</p>
          </div>
          <dialog class="cookie-dialog">
            <h2>Cookies</h2>
            <p>
              We use cookies to improve your experience on our website. By clicking "Accept", you agree to the use of cookies for marketing and analystic purposes.
            </p>

            <div class="btngroup">
            <button class="accept">Accept</button>
            <button class="setting">Setting</button>
            </div>
          </dialog>

          <dialog class="setting-dialog">
            <h2>Settings</h2>
            <button class="unselect">Unselect All</button>
            <div class="row">
              <p>Brower</p>
              <label class="switch">
                <input type="checkbox" id="browsercheck" checked>
                <span class="slider"></span>
              </label>
            </div>

            <div class="row">
              <p>Operating system</p>
              <label class="switch">
                <input type="checkbox" id="oscheck" checked>
                <span class="slider"></span>
              </label>
            </div>

            <div class="row">
              <p>Screen width</p>
              <label class="switch">
                <input type="checkbox" id="widthcheck" checked>
                <span class="slider"></span>
              </label>
            </div>

            <div class="row">
              <p>Screen height</p>
              <label class="switch">
                <input type="checkbox" id="heightcheck" checked>
                <span class="slider"></span>
              </label>
            </div>

            <button class="savebtn">Save preferences</button>
          </dialog>
        </main>
      </div>
    </body>
</html>
